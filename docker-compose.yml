version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: basesiz
      POSTGRES_USER: workost
      POSTGRES_PASSWORD: '!@34QWerterm'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://workost:!@34QWerterm@db:5432/basesiz
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge